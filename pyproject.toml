[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academicguard"
version = "1.0.0"
description = "Open-source academic writing integrity toolkit: AI detection, plagiarism, grammar, and venue style checking (IEEE, Elsevier, ACM, IET, BCS)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AcademicGuard Contributors" }]
keywords = ["ai-detection", "plagiarism", "grammar", "academic-writing", "ieee", "elsevier", "acm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "transformers>=4.40",
    "torch>=2.0",
    "language-tool-python>=2.7",
    "datasketch>=1.6",
    "spacy>=3.7",
    "python-docx>=1.1",
    "pdfminer.six>=20221105",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "black", "ruff", "mypy"]

[project.scripts]
academicguard = "academicguard.cli:app"
ag = "academicguard.cli:app"

[project.urls]
Homepage = "https://sunilgentyala.github.io/academicguard/"
Repository = "https://github.com/sunilgentyala/academicguard"
Issues = "https://github.com/sunilgentyala/academicguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["academicguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
